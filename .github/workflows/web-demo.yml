name: Web demo — Faciup Live
on:
  push:
    branches: [web-demo]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-demo-preview
  cancel-in-progress: true
jobs:
  preview:
    if: github.ref == 'refs/heads/web-demo'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund
      - run: npm run typecheck
      - run: node --test test/preview.test.ts
      - name: Upload bản xem trước, không triển khai production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node web/deploy-preview.mjs
