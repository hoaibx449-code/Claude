name: Ink Studio — máy dựng cho trang web

# Trang web đánh thức workflow này (GitHub API) khi có video chờ dựng. Máy nhận lần lượt mọi video
# đang chờ (/api/ink-runner), dựng rồi gửi kết quả về, hết việc thì dừng.
# Cần secrets: NV_API_URL (địa chỉ trang, vd https://faciup.id.vn) và RUNNER_TOKEN (giống Worker).
# Khoá AI và giọng đọc do trang web gửi kèm từng việc (Quản trị → API & khoá), không nằm trong repo.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ink-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ink/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # installs never hold the queue: each has a time limit and apt retries instead of waiting forever on a lock or a
      # slow mirror (a stuck install once kept every video waiting for half an hour)
      - name: Cài FFmpeg và thư viện
        timeout-minutes: 15
        run: |
          for i in 1 2 3; do
            sudo timeout 420 apt-get -o DPkg::Lock::Timeout=60 -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq \
              && sudo timeout 420 apt-get -o DPkg::Lock::Timeout=60 -o Acquire::Retries=3 install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core && break
            echo "apt chưa xong (lần $i), thử lại"; sleep 10
          done
          command -v ffmpeg
          pip install -q --timeout 60 -r ink/requirements.txt
      - name: Cài trình duyệt và thư viện cho kiểu Điện ảnh
        timeout-minutes: 10
        run: |
          python -m playwright install --with-deps chromium
          cd ink/hbx && npm ci --no-audit --no-fund
      - name: Cài bộ dựng Shorts 3D
        timeout-minutes: 8
        run: |
          npm ci --prefix shorts/renderer/engine --no-audit --no-fund
          cd shorts/renderer/engine && npx playwright install chromium
      - name: Dùng lại giọng đã đọc
        uses: actions/cache@v4
        with:
          path: |
            ink/.cache
            ~/.cache/huggingface
            ~/.hbx_models
          key: ink-voice-${{ github.run_id }}
          restore-keys: ink-voice-
      - name: Dựng các video đang chờ
        working-directory: ink
        env:
          NV_API_URL: ${{ secrets.NV_API_URL }}
          RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
          INK_REVIEW_DIR: ${{ github.workspace }}/ink-review
        run: python -m ink.site
      # each finished cinematic video with its storyboard, kept 3 days so it can be checked frame by frame
      - name: Lưu video để kiểm tra
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ink-review
          path: ink-review
          retention-days: 3
          if-no-files-found: ignore
