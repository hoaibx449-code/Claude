<link rel="manifest" href="/manifest.webmanifest">

<script src="/render-desk.js" defer></script>
<script src="/banks.js" defer></script>

</head>
<body>
<header class="top">
  <a class="brand" href="#/"><span class="logo" aria-hidden="true">✎</span><span id="brandName">Nét Vẽ</span> <span class="accent" id="brandAccent">Studio</span><span class="beta" id="betaBadge" hidden>Beta</span></a>
  <nav class="nav" id="nav" aria-label="Điều hướng chính">
    <a href="#/" data-route="home">Trang chủ</a>
    <a href="#/mau" data-route="mau">Định dạng</a>
    <a href="#/cong-dong" data-route="cong-dong">Cộng đồng</a>
    <a href="#/goi" data-route="goi">Bảng giá</a>
    <a href="#/video" data-route="video">Video của tôi</a>
  </nav>
  <div class="who">
    <button class="ghost small" id="loginBtn" type="button" hidden>Đăng nhập</button>
    <a class="btn small" id="createBtn" href="#/tao" data-ev="header-create">Tạo video</a>
    <div class="usermenu">
      <button id="account" class="avatar" type="button" hidden aria-haspopup="menu" aria-expanded="false" aria-controls="userMenu" aria-label="Tài khoản và gói"></button>
      <div id="userMenu" class="menu" role="menu" hidden></div>
    </div>
    <button id="logout" type="button" hidden>Đăng xuất</button>
    <a id="adminLink" href="#/admin" hidden>Quản trị</a>
  </div>
</header>

<main id="view" class="wrap" aria-live="polite">
  <div class="loader" role="status" aria-label="Đang tải"><svg viewBox="0 0 120 60" aria-hidden="true"><path class="ink" d="M8 40 C 22 10, 38 10, 46 34 S 70 58, 82 30 S 104 8, 112 26"/></svg><span>Đang mở xưởng vẽ…</span></div>
</main>

<nav class="tabbar" id="tabbar" aria-label="Thanh điều hướng">
  <a href="#/" data-route="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Trang chủ</a>
  <a href="#/cong-dong" data-route="cong-dong"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16.5 14.6c2.6.1 4.4 1.8 5 4.4"/></svg>Cộng đồng</a>
  <a href="#/tao" data-route="tao"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="6"/><path d="M12 8v8M8 12h8"/></svg>Tạo video</a>
  <a href="#/video" data-route="video"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>Video</a>
  <a href="#/mau" data-route="mau"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2a10 10 0 1 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.3A4.7 4.7 0 0 0 22 10.6C22 5.8 17.5 2 12 2z"/></svg>Định dạng</a>
</nav>

<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
