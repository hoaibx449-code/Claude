<!doctype html>
<html lang="vi">
<head>

<script src="/engine.js" defer></script>
<script src="/app.js" defer></script>
<script src="/admin.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><span class="logo" aria-hidden="true">✎</span><span id="brandName">Nét Vẽ</span> <span class="accent" id="brandAccent">Studio</span></a>
  <nav class="nav" id="nav" aria-label="Điều hướng chính">

    <a href="#/mau" data-route="mau">Phong cách</a>
    <a href="#/goi" data-route="goi">Bảng giá</a>
    <a href="#/video" data-route="video">Video của tôi</a>
  </nav>
  <div class="who">
    <a id="adminLink" href="#/admin" hidden>Quản trị</a>
    <span id="whoEmail"></span>
    <a id="account" class="avatar" href="#/tai-khoan" hidden aria-label="Tài khoản"></a>
    <button class="small" id="loginBtn" type="button" hidden>Đăng nhập</button>
    <button class="ghost small" id="logout" type="button" hidden>Đăng xuất</button>
  </div>
</header>

<main id="view" class="wrap" aria-live="polite">
  <p class="muted">Đang tải…</p>
</main>

<nav class="tabbar" id="tabbar" aria-label="Thanh điều hướng">

  <a href="#/video" data-route="video"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>Video</a>
